name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar markdownlint-cli2
        run: npm install -g markdownlint-cli2
      - name: Lint de markdown (0 errores obligatorio)
        run: markdownlint-cli2 "*.md" "**/*.md" "**/**/*.md" "**/**/**/*.md" "**/**/**/**/*.md"
        continue-on-error: false

  gitleaks:
    name: Chequeo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ejecutar gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}